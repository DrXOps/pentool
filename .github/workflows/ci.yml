name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run linter
      run: uv run ruff check pentool/
      continue-on-error: true  # informational, don't block CI

    - name: Run unit tests
      run: uv run pytest tests/unit/ -v --tb=short

    - name: Run tests with coverage
      run: uv run pytest tests/unit/ --cov=pentool --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  type-check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        python-version: '3.11'
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run mypy
      run: uv run mypy pentool/ --ignore-missing-imports
      continue-on-error: true  # ~159 pre-existing type errors, not blocking

  build:
    runs-on: ubuntu-latest
    needs: [test, type-check]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        python-version: '3.11'
        enable-cache: true

    - name: Build package
      run: uv build

    - name: Check package
      run: uvx twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
