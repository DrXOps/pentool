name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Границы репозитория, независимые от машины разработчика:
  #   guard   — в коммит не попали временные файлы/артефакты сборки;
  #   secrets — в истории не появился секрет.
  # Дублирует .claude/hooks/* и pre-commit намеренно: ни один из них не
  # работает в чужом клоне и CI.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard — в коммите только файлы проекта
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "${base:-}" ]; then
            base="${{ github.event.before }}"
            case "$base" in
              "" | 0000000000000000000000000000000000000000) base="HEAD~1" ;;
            esac
          fi
          git diff --name-only --diff-filter=ACMR "$base" HEAD > /tmp/changed.txt 2>/dev/null \
            || git ls-files > /tmp/changed.txt
          wc -l < /tmp/changed.txt
          bash scripts/pre-commit-guard.sh --files-from /tmp/changed.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: detect-secrets
        run: uvx --from detect-secrets detect-secrets-hook --baseline .secrets.baseline $(git ls-files)

  test:
    needs: [guard, secrets]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run linter
      run: uv run ruff check pentool/
      continue-on-error: true  # informational, don't block CI

    - name: Run unit tests
      run: uv run pytest tests/unit/ -v --tb=short

    - name: Run tests with coverage
      run: uv run pytest tests/unit/ --cov=pentool --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Кроссплатформенность: приложение заявляет Windows как целевую платформу,
  # а основная разработка идёт на WSL — нативная Windows-проверка ловит
  # path/таймер/кодировочные различия, которые на Linux не видны.
  test-windows:
    needs: [guard, secrets]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        python-version: '3.12'
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen
      shell: bash

    - name: Run unit tests
      run: uv run pytest tests/unit/ -q
      shell: bash

  type-check:
    needs: [guard, secrets]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        python-version: '3.11'
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run mypy
      run: uv run mypy pentool/ --ignore-missing-imports
      continue-on-error: true  # ~159 pre-existing type errors, not blocking

  build:
    runs-on: ubuntu-latest
    needs: [test, test-windows, type-check]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        python-version: '3.11'
        enable-cache: true

    - name: Build package
      run: uv build

    - name: Check package
      run: uvx twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
