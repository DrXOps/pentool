name: Sync to Gitee

# ВРЕМЕННО ОТКЛЮЧЕНО (2026-08-03): нет доступа к Gitee-аккаунту для
# настройки GITEE_TOKEN/GITEE_REPO secrets. Включить обратно, когда
# доступ появится — снять комментарий с триггеров ниже.
on:
  # push:
  #   branches:
  #     - main
  #     - master
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}   # e.g. username/pentool
        run: |
          git remote add gitee https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git
          git push gitee --all --force
          git push gitee --tags --force
