name: Dev Build (TestPyPI)

# Runs on every push to `develop` (the active-development branch — see
# memory/git_workflow.md). Produces a dist/ build tagged with a unique
# .devN version suffix (N = this run's number), smoke-tests it in a clean
# venv, uploads it as a downloadable Actions artifact, and — only if the
# smoke test passes — publishes it to TestPyPI so it can be installed with:
#   uv tool install --index-url https://test.pypi.org/simple/ pentool==<version>
#   # или по старинке:
#   pip install -i https://test.pypi.org/simple/ pentool==<version>
#
# This never touches the real PyPI release (that's publish.yml, triggered
# only by a `v*` tag push) and never bumps the version checked into
# pyproject.toml — the .devN suffix is applied in-place in the CI runner
# only, so it doesn't collide with the manual release-version-bump process.
on:
  push:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.11'
          enable-cache: true

      - name: Set dev version suffix
        id: version
        run: |
          BASE_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          DEV_VERSION="${BASE_VERSION}.dev${GITHUB_RUN_NUMBER}"
          sed -i "s/^version = \".*\"/version = \"${DEV_VERSION}\"/" pyproject.toml
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Dev build version: ${DEV_VERSION}"

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Smoke test (install wheel in clean venv, import + CLI check)
        run: bash scripts/smoke_test.sh

      - name: Upload dist/ as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pentool-dev-${{ steps.version.outputs.dev_version }}
          path: dist/
          retention-days: 14

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: uvx twine upload --repository-url https://test.pypi.org/legacy/ dist/*

      - name: Summary
        run: |
          echo "## 🧪 Dev build published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: \`${{ steps.version.outputs.dev_version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install from TestPyPI:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "uv tool install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ pentool==${{ steps.version.outputs.dev_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Or download the \`dist/\` artifact from this run and:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "uv tool install dist/*.whl" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
