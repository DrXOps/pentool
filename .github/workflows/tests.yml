name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    name: Unit Tests (1475+)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check layer violations
        run: uv run python tools/check_layers.py

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run integration tests (storage + services + events)
        run: |
          uv run pytest tests/integration/test_http_storage.py \
                 tests/integration/test_proxy_service.py \
                 tests/integration/test_event_bus.py \
                 tests/integration/test_repeater_service.py \
                 -v --tb=short
        continue-on-error: true  # repeater mock may fail in CI
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run TUI integration tests
        run: |
          uv run pytest tests/integration/test_navigation.py \
                 tests/integration/test_tui_events.py \
                 tests/integration/test_new_features.py \
                 -v --tb=short
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        continue-on-error: true  # TUI tests may be flaky in headless CI

  e2e:
    name: E2E Tests (Textual Pilot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run E2E tests
        run: uv run pytest tests/e2e/ -v --tb=short
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        continue-on-error: true  # E2E tests may be flaky in headless CI

  security:
    name: Security Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run security tests
        run: uv run pytest tests/security/ -v --tb=short
        continue-on-error: true  # may be skipped if scanner module unavailable
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run performance tests
        run: uv run pytest tests/performance/ -v --tb=short -m "performance or slow"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        continue-on-error: true  # performance bounds may vary on CI

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [ unit, integration ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run coverage
        run: |
          uv run coverage run -m pytest \
            tests/unit/ \
            tests/integration/test_http_storage.py \
            tests/integration/test_proxy_service.py \
            tests/integration/test_event_bus.py \
            tests/integration/test_repeater_service.py \
            tests/security/ \
            -q
          uv run coverage report
          uv run coverage xml
        continue-on-error: true  # informational metric only

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  snapshot:
    name: Snapshot Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run snapshot tests
        run: uv run pytest tests/snapshot/ -v --tb=short
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        continue-on-error: true

      - name: Upload snapshot diffs (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshot-diffs
          path: |
            tests/snapshot/**/*-diff.png
            tests/snapshot/**/*.svg

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: flake8
        run: uv run flake8 pentool/ --max-line-length=120 --extend-ignore=E203,W503,E221,E272,E402,W391
        continue-on-error: true  # informational only, don't block CI

      - name: mypy (non-blocking)
        run: uv run mypy pentool/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true
