name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    name: Unit Tests (1475+)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
          pip install aioresponses

      - name: Check layer violations
        run: python tools/check_layers.py

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
          pip install aioresponses

      - name: Run integration tests (storage + services + events)
        run: |
          pytest tests/integration/test_http_storage.py \
                 tests/integration/test_proxy_service.py \
                 tests/integration/test_event_bus.py \
                 tests/integration/test_repeater_service.py \
                 -v --tb=short
        continue-on-error: true  # repeater mock may fail in CI
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Run TUI integration tests
        run: |
          pytest tests/integration/test_navigation.py \
                 tests/integration/test_tui_events.py \
                 tests/integration/test_new_features.py \
                 -v --tb=short
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        continue-on-error: true  # TUI tests may be flaky in headless CI

  e2e:
    name: E2E Tests (Textual Pilot)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
          pip install aioresponses

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v --tb=short
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        continue-on-error: true  # E2E tests may be flaky in headless CI

  security:
    name: Security Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
          pip install aioresponses

      - name: Run security tests
        run: |
          pytest tests/security/ -v --tb=short
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
          pip install aioresponses

      - name: Run performance tests
        run: |
          pytest tests/performance/ -v --tb=short -m "performance or slow"
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        continue-on-error: true  # performance bounds may vary on CI

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [ unit, integration ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt
          pip install aioresponses

      - name: Run coverage
        run: |
          coverage run -m pytest \
            tests/unit/ \
            tests/integration/test_http_storage.py \
            tests/integration/test_proxy_service.py \
            tests/integration/test_event_bus.py \
            tests/integration/test_repeater_service.py \
            tests/security/ \
            -q
          coverage report --fail-under=60
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  snapshot:
    name: Snapshot Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Run snapshot tests
        run: |
          pytest tests/snapshot/ -v --tb=short
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        continue-on-error: true

      - name: Upload snapshot diffs (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshot-diffs
          path: |
            tests/snapshot/**/*-diff.png
            tests/snapshot/**/*.svg

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install flake8 mypy

      - name: flake8
        run: flake8 pentool/ --max-line-length=120 --extend-ignore=E203,W503,E221,E272,E402,W391

      - name: mypy (non-blocking)
        run: mypy pentool/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true
