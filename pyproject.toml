[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pentool"
version = "0.5.2-dev"
description = "Modern Web Pentesting TUI - Professional security testing tool"
authors = [
    {name = "Pentool Team", email = "dev@pentool.pro"}
]
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.10"
keywords = ["pentesting", "security", "burp", "proxy", "scanner", "intruder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    "textual>=0.40.0",
    "textual-fastdatatable>=0.14.0,<0.19",
    "pyarrow>=10.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "click>=8.1.0",
    "cryptography>=41.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "pyperclip>=1.11.0",
]

[project.optional-dependencies]
ai = [
    "pentool-mcp-server>=0.1.0",
    # Playwright: headless browser for --real capture, crawler js_render and
    # future scanner JS support. Browser binary is installed separately:
    #   uv tool run --with playwright python -m playwright install chromium
    "playwright>=1.40.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/DrXOps/pentool"
Repository = "https://github.com/DrXOps/pentool"
Issues = "https://github.com/DrXOps/pentool/issues"
Changelog = "https://github.com/DrXOps/pentool/blob/main/CHANGELOG.md"

[project.scripts]
pentool = "pentool.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pentool*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
# Textual CSS files (*.tcss) live next to their screens/widgets and are
# read at runtime via Path(__file__).parent / "screen.tcss" — setuptools
# does not include non-.py files by default, so every *.tcss must be
# listed here or the wheel builds "successfully" but crashes at runtime
# with FileNotFoundError the moment any screen tries to load its CSS.
pentool = ["*.tcss", "**/*.tcss"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "perf: performance benchmarks (small N, CI-friendly; skip in normal unit runs)",
    "network: tests that hit a live target (skip by default)",
    "huge: tests that touch multi-hundred-MB payload files / DVWA (only on demand)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["pentool"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
# 120, а не 100: репозиторий форматируется на 120 (black/isort, а с 2026-11-17 —
# ruff format). Пока здесь стояло 100, `ruff format` из хука форматирования
# переписывал файлы по 100 — то есть любая правка через агента раздувала дифф на
# сотни строк. Один стандарт на все инструменты.
line-length = 120
target-version = "py310"

# Секции `lint` — с 2026-11-17: плоские select/ignore в [tool.ruff] устарели, и
# ruff предупреждал об этом в каждом прогоне (шум в хуках и в отчётах).
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# В тестах часть приёмов — норма, а не долг:
#   E731 — лямбда в parametrize читается лучше, чем def-обёртка;
#   N802/N814/N817/N818 — имена классов под тестом (CamelCase) переносятся в
#     тесты как есть, включая исключения без суффикса Error;
#   E741 — `l` в тестовых данных встречается как данные, а не как имя.
"tests/**" = ["E731", "N802", "N806", "N814", "N817", "N818", "E741"]
# Скрипты, которые правят sys.path перед импортом проекта: E402 тут неизбежен.
"tests/perf/run_spider_timed.py" = ["E402"]
"tests/unit/modules/test_intruder_http_client_reuse.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.1.0",
    "pytest-textual-snapshot>=0.4.0",
    "aioresponses>=0.7.6",
    "coverage>=7.3.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "flake8>=6.1.0",
    "pre-commit>=3.4.0",
    "textual>=8.0.0",
]
