# What is true about this project RIGHT NOW — the only place where current state is written.
#
# Rules (enforced by tools/verify_facts.py and tools/check_plans.py):
#   * every fact has an executable check from tools/verify_facts.py;
#   * "kind: code"  — the check reads the repository (fast, offline, runs in pre-commit);
#   * "kind: external" — the check needs the network or a human (site, CI, mail); it is
#     verified on demand (`--online`), and `last_verified` records WHEN it was proven.
#     Stale external facts are reported as WARN, never as "done";
#   * plan documents (MYPLANS/) must not restate state: they link to a fact id.
#
# History lives in git: change a value with the date and the reason, git shows the trail.

