repos:
  - repo: https://github.com/psf/black
    rev: 23.12.0
    hooks:
      - id: black
        args: [--line-length=120]

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # Значение с запятой ОБЯЗАТЕЛЬНО в кавычках: в flow-списке YAML
        # `E203,W503` без кавычек — два элемента, и flake8 получает
        # аргумент 'W503' как путь (E902 FileNotFoundError).
        args: [--max-line-length=120, "--extend-ignore=E203,W503"]

  - repo: local
    hooks:
      - id: check-layers
        name: Check layer violations
        entry: python tools/check_layers.py
        language: python
        pass_filenames: false
        always_run: true

      # check-tui-css: каждый .tcss-селектор обязан совпадать с id/классом/типом,
      # которые реально создаёт Python (REPORT.md F-008: 11 мёртвых селекторов).
      # Скрипт импортирует pentool.tui ради словаря типов, поэтому запускается
      # в окружении проекта, а не в изолированном venv хука.
      - id: check-tui-css
        name: check TUI CSS selectors against the DOM
        entry: uv run python tools/check_tui_css.py
        language: system
        pass_filenames: false
        always_run: true

      # Трещотка ADR-6: число «молчаливых» `except Exception: pass` в файле не
      # растёт. Базовая линия — tools/silent_except_baseline.json; понижение —
      # `python tools/check_silent_except.py --update`.
      - id: check-silent-except
        name: no new silent except Exception (ADR-6 ratchet)
        entry: uv run python tools/check_silent_except.py
        language: system
        pass_filenames: false
        always_run: true

      # Трещотка ADR-6 по всему pentool/: число `except Exception`, которые ни
      # логируют, ни пробрасывают (ruff BLE001), в файле не растёт. Базовая
      # линия — tools/broad_except_baseline.json (551 место на 89 файлов на
      # 2026-11-16; понижается пофайловым конвейером .claude/tmp/f009/);
      # понижение — `python tools/check_broad_except.py --update`.
      - id: check-broad-except
        name: no new blind except Exception (ADR-6 ratchet)
        entry: uv run python tools/check_broad_except.py
        language: system
        pass_filenames: false
        always_run: true

      # Трещотка ADR-6 по путям данных: широкий `except` внутри функции
      # сохранения/загрузки/восстановления обязан пробрасывать или писать
      # warning+ с трейсбеком (иначе «сохранил», а не сохранилось). Базовая
      # линия — tools/logging_policy_baseline.json (149 мест на 29 файлов);
      # понижение — `python tools/check_logging_policy.py --update`.
      - id: check-logging-policy
        name: data-path failures are logged with a traceback
        entry: uv run python tools/check_logging_policy.py
        language: system
        pass_filenames: false
        always_run: true

      # guard-git-staging: в коммит попадают только файлы проекта.
      # Проверяет ИНДЕКС, а не команду — работает и для `git commit` из IDE,
      # и в CI (через --files-from). Логика и списки продублированы из
      # .claude/hooks/guard-git-staging.sh намеренно: pre-commit должен
      # работать в свежем клоне, где .claude/ может отсутствовать.
      - id: guard-git-staging
        name: guard git staging (только файлы проекта)
        entry: scripts/pre-commit-guard.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # detect-secrets: блокирует коммит с секретом. Baseline (.secrets.baseline)
      # фиксирует 23 уже существующие находки — все в тестах и license-коде
      # (фиктивные ключи, тестовые JWT, сгенерированные сертификаты), не секреты.
      # Обновление baseline: detect-secrets scan --baseline .secrets.baseline
      # Ложное срабатывание в новой строке помечается `pragma: allowlist secret`.
      - id: detect-secrets
        name: detect-secrets (секреты не попадают в историю)
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: python
        additional_dependencies: ["detect-secrets>=1.5,<2"]
        exclude: ^\.secrets\.baseline$
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      # trailing-whitespace / end-of-file-fixer намеренно не включены: они
      # перепишут сотни существующих файлов при первом прогоне. Включать
      # отдельным коммитом, когда весь код пройдёт форматтеры.
