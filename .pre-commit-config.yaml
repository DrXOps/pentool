repos:
  # Один форматтер и один линтер — ruff (2026-11-17). black и isort убраны:
  # они и ruff держали разные настройки, из-за чего `ruff format` из хука
  # format-on-edit переписывал файлы вопреки black (line-length 100 против 120).
  # Теперь стандарт один — `[tool.ruff]` в pyproject.toml, 120.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        # flake8 остаётся ради того, чего нет в стабильных правилах ruff:
        # pycodestyle E2xx (пробелы после запятой) и F402. Проверяет только код
        # пакета: у тестов свои конвенции (CamelCase классов под тестом, лямбды
        # в параметризации), они описаны в [tool.ruff.lint.per-file-ignores], а
        # flake8 их не читает; дублировать политику в двух местах — источник
        # расхождений.
        files: ^pentool/
        # Значение с запятой ОБЯЗАТЕЛЬНО в кавычках: в flow-списке YAML
        # `E203,W503` без кавычек — два элемента, и flake8 получает
        # аргумент 'W503' как путь (E902 FileNotFoundError).
        args: [--max-line-length=120, "--extend-ignore=E203,W503"]

  - repo: local
    hooks:
      - id: check-layers
        name: Check layer violations
        entry: python tools/check_layers.py
        language: python
        pass_filenames: false
        always_run: true

      # check-lazy-screens: экраны модулей монтируются лениво
      # (pentool/tui/screen_lifecycle.py). Гвард запрещает три ошибки, которые
      # ломают TUI незаметно: прямой query_one(SCREEN_X)/query_one(SomeScreen),
      # сборку экранов в PentoolApp.compose() (именно она стоила ~1.4 с на
      # действие, см. MYPLANS T-002) и использование результата get_screen()
      # без проверки на None. Разбор — AST, без импорта Textual.
      - id: check-lazy-screens
        name: module screens are lazy and None-checked
        entry: python tools/check_lazy_screens.py
        language: python
        pass_filenames: false
        always_run: true

      # review-new-files: у каждого ДОБАВЛЕННОГО файла должно быть осознанное
      # решение — в репозиторий или в .gitignore. guard-git-staging проверяет
      # только каталог, поэтому внутри разрешённых каталогов в origin попадали
      # черновики (`aaaaaaaaaaaa.png`, `tui-lab/`, ELF-бинарь `bin/xclip`).
      # Журнал решений — .claude/state/new-file-decisions.tsv (локальный).
      # check-english-comments: код пишем на английском. Долг (3466 строк на
      # 2026-11-19) закрывается пофайлово, гвард держит потолок — новый русский
      # комментарий в .py роняет коммит. Данные (тексты UI, тестовые строки) не
      # считаются; осознанная кириллица помечается `# i18n-ok: <причина>`.
      - id: check-english-comments
        name: "комментарии и докстринги — на английском"
        entry: python tools/check_english_comments.py
        language: python
        pass_filenames: false
        always_run: true

      - id: review-new-files
        name: "новые файлы: решите — в репозиторий или в .gitignore"
        entry: python tools/review_new_files.py
        language: python
        pass_filenames: false
        always_run: true

      # check-tui-css: каждый .tcss-селектор обязан совпадать с id/классом/типом,
      # которые реально создаёт Python (REPORT.md F-008: 11 мёртвых селекторов).
      # Скрипт импортирует pentool.tui ради словаря типов, поэтому запускается
      # в окружении проекта, а не в изолированном venv хука.
      - id: check-tui-css
        name: check TUI CSS selectors against the DOM
        entry: uv run python tools/check_tui_css.py
        language: system
        pass_filenames: false
        always_run: true

      # Трещотка ADR-6: число «молчаливых» `except Exception: pass` в файле не
      # растёт. Базовая линия — tools/silent_except_baseline.json; понижение —
      # `python tools/check_silent_except.py --update`.
      - id: check-silent-except
        name: no new silent except Exception (ADR-6 ratchet)
        entry: uv run python tools/check_silent_except.py
        language: system
        pass_filenames: false
        always_run: true

      # Трещотка ADR-6 по всему pentool/: число `except Exception`, которые ни
      # логируют, ни пробрасывают (ruff BLE001), в файле не растёт. Базовая
      # линия — tools/broad_except_baseline.json (430 мест на 85 файлов на
      # 2026-11-17; понижается пофайловым конвейером .claude/tmp/f009/);
      # понижение — `python tools/check_broad_except.py --update`.
      - id: check-broad-except
        name: no new blind except Exception (ADR-6 ratchet)
        entry: uv run python tools/check_broad_except.py
        language: system
        pass_filenames: false
        always_run: true

      # Трещотка ADR-6 по путям данных: широкий `except` внутри функции
      # сохранения/загрузки/восстановления обязан пробрасывать или писать
      # warning+ с трейсбеком (иначе «сохранил», а не сохранилось). Базовая
      # линия — tools/logging_policy_baseline.json (149 мест на 29 файлов);
      # понижение — `python tools/check_logging_policy.py --update`.
      - id: check-logging-policy
        name: data-path failures are logged with a traceback
        entry: uv run python tools/check_logging_policy.py
        language: system
        pass_filenames: false
        always_run: true

      # Факты проекта: «что сейчас правда» записано в tools/facts.yml, у каждого факта
      # есть исполняемая проверка (tools/verify_facts.py). Гвард падает, если факт
      # разошёлся с кодом, если внешний факт (сайт, CI, почта) устарел, или если
      # docs/PROJECT_STATE.md не пересобран после правки фактов (`--render`).
      # Зачем: в плановых документах годами лежали взаимоисключающие утверждения
      # («оплата работает, кроме письма» против «ключи приходят письмом»), и понять,
      # что правда, можно было только перечитав код.
      - id: verify-facts
        name: project facts match the code (tools/facts.yml)
        entry: uv run python tools/verify_facts.py --check-render
        language: system
        pass_filenames: false
        always_run: true

      # Планы: «сделано» подтверждается фактом, а не прозой. Проверяет MYPLANS/
      # (локальный каталог; если его нет — пропускает). Правила — MYPLANS/README.md.
      - id: check-plans
        name: "планы: статусы подтверждены фактами"
        entry: uv run python tools/check_plans.py
        language: system
        pass_filenames: false
        always_run: true

      # guard-git-staging: в коммит попадают только файлы проекта.
      # Проверяет ИНДЕКС, а не команду — работает и для `git commit` из IDE,
      # и в CI (через --files-from). Логика и списки продублированы из
      # .claude/hooks/guard-git-staging.sh намеренно: pre-commit должен
      # работать в свежем клоне, где .claude/ может отсутствовать.
      - id: guard-git-staging
        name: guard git staging (только файлы проекта)
        entry: scripts/pre-commit-guard.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

      # detect-secrets: блокирует коммит с секретом. Baseline (.secrets.baseline)
      # фиксирует 23 уже существующие находки — все в тестах и license-коде
      # (фиктивные ключи, тестовые JWT, сгенерированные сертификаты), не секреты.
      # Обновление baseline: detect-secrets scan --baseline .secrets.baseline
      # Ложное срабатывание в новой строке помечается `pragma: allowlist secret`.
      - id: detect-secrets
        name: detect-secrets (секреты не попадают в историю)
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: python
        additional_dependencies: ["detect-secrets>=1.5,<2"]
        exclude: ^\.secrets\.baseline$
        pass_filenames: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      # trailing-whitespace / end-of-file-fixer намеренно не включены: они
      # перепишут сотни существующих файлов при первом прогоне. Включать
      # отдельным коммитом, когда весь код пройдёт форматтеры.
