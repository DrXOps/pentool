name: Security Headers
type: headers
description: "Security headers for passive scanning — required headers, expected values, and missing header detection"
detection: "passive — check response headers for presence/absence/value"

# Headers that MUST be present (required)
required_headers:
  - name: "Strict-Transport-Security"
    description: "HTTP Strict Transport Security (HSTS) — enforces HTTPS"
    expected_pattern: "max-age=\\d+"
    recommended_value: "max-age=31536000; includeSubDomains; preload"
    severity: "high"

  - name: "X-Content-Type-Options"
    description: "Prevents MIME-type sniffing by the browser"
    expected_value: "nosniff"
    severity: "medium"

  - name: "X-Frame-Options"
    description: "Clickjacking protection"
    expected_values:
      - "DENY"
      - "SAMEORIGIN"
    severity: "medium"

  - name: "Content-Security-Policy"
    description: "Content Security Policy (CSP)"
    expected_pattern: "default-src|script-src|object-src"
    severity: "high"

  - name: "Referrer-Policy"
    description: "Controls Referer header transmission"
    expected_values:
      - "no-referrer"
      - "no-referrer-when-downgrade"
      - "strict-origin"
      - "strict-origin-when-cross-origin"
    severity: "low"

  - name: "Permissions-Policy"
    description: "Restricts access to browser APIs (formerly Feature-Policy)"
    expected_pattern: "geolocation|camera|microphone"
    severity: "low"

  - name: "X-XSS-Protection"
    description: "Built-in browser XSS filter (legacy, but useful for older browsers)"
    expected_value: "1; mode=block"
    severity: "low"

  - name: "Cache-Control"
    description: "Controls caching of sensitive pages"
    expected_pattern: "no-store|no-cache|private"
    severity: "low"

  - name: "Cross-Origin-Embedder-Policy"
    description: "Isolates cross-origin resources"
    expected_value: "require-corp"
    severity: "low"

  - name: "Cross-Origin-Opener-Policy"
    description: "Isolates window.opener"
    expected_values:
      - "same-origin"
      - "same-origin-allow-popups"
    severity: "low"

  - name: "Cross-Origin-Resource-Policy"
    description: "Restricts cross-origin resource reads"
    expected_values:
      - "same-site"
      - "same-origin"
      - "cross-origin"
    severity: "low"

# Headers that MUST NOT be present (information leakage)
forbidden_headers:
  - name: "Server"
    description: "Leaks web server version"
    severity: "info"
    risk: "information disclosure"

  - name: "X-Powered-By"
    description: "Leaks technology stack (PHP, ASP.NET, Express)"
    severity: "info"
    risk: "information disclosure"

  - name: "X-AspNet-Version"
    description: "Leaks ASP.NET version"
    severity: "info"
    risk: "information disclosure"

  - name: "X-AspNetMvc-Version"
    description: "Leaks ASP.NET MVC version"
    severity: "info"
    risk: "information disclosure"

  - name: "X-Generator"
    description: "Leaks CMS or framework"
    severity: "info"
    risk: "information disclosure"

  - name: "X-Runtime"
    description: "Leaks processing time and stack (Rails)"
    severity: "info"
    risk: "information disclosure"

  - name: "X-Version"
    description: "Leaks application version"
    severity: "info"
    risk: "information disclosure"

# Insecure values for existing headers
insecure_values:
  - header: "Access-Control-Allow-Origin"
    dangerous_values:
      - "*"
    description: "Wildcard CORS allows reading responses from any domain"
    severity: "high"

  - header: "Access-Control-Allow-Credentials"
    dangerous_condition: "true + Access-Control-Allow-Origin: *"
    description: "Credentials + wildcard origin — especially dangerous combination"
    severity: "critical"

  - header: "Content-Security-Policy"
    dangerous_patterns:
      - "unsafe-inline"
      - "unsafe-eval"
      - "* "
    description: "Unsafe CSP directives neutralize the protection"
    severity: "medium"

  - header: "Set-Cookie"
    check_flags:
      - flag: "HttpOnly"
        description: "Missing HttpOnly allows cookie theft via XSS"
        severity: "high"
      - flag: "Secure"
        description: "Missing Secure transmits cookies over HTTP"
        severity: "high"
      - flag: "SameSite"
        description: "Missing SameSite is vulnerable to CSRF"
        severity: "medium"
        expected_values:
          - "SameSite=Strict"
          - "SameSite=Lax"

# Detection signatures (used in passive scanner)
signatures:
  - "X-Powered-By"
  - "X-AspNet-Version"
  - "X-Runtime"
  - "Server:"

# Placeholder payloads (not applied, for structural compatibility only)
payloads: []
